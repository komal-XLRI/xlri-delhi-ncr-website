<?xml version="1.0" encoding="UTF-8"?>
<!--
  XLRI triangle motif, redrawn from the cluster on the institute's own
  homepage (xlri.ac.in, beside Our Important Links) so the two sites share
  one mark. Six translucent triangles; the overlap of the bottom pair is part
  of the artwork. Placement and motion live in the "Brand motif" block of
  src/styles/base.css.

  CAUTION: this is XML, and an XML comment may not contain two hyphens in a
  row. Naming a CSS custom property in prose here silently breaks the file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122 170" fill="none">
  <!-- Top left, apex up. Olive green. -->
  <path fill="rgb(153,177,0)" fill-opacity="0.51" d="M0 30 L34 30 L17 0 Z" />

  <!-- Top right, apex up. Pale sky blue. -->
  <path fill="rgb(141,200,249)" fill-opacity="0.33" d="M60 33 L97 33 L78.5 0 Z" />

  <!-- Middle, apex up. Bright blue. -->
  <path fill="rgb(29,153,255)" fill-opacity="0.42" d="M24 84 L64 84 L44 50 Z" />

  <!-- Right, apex down. Steel blue, the largest. -->
  <path fill="rgb(32,118,190)" fill-opacity="0.43" d="M73 85 L121 85 L97 127 Z" />

  <!-- Bottom, apex down. Lime. -->
  <path fill="rgb(196,219,46)" fill-opacity="0.48" d="M49 128 L97 128 L73 170 Z" />

  <!-- Bottom right, apex up, over the lime. Steel blue, lighter. -->
  <path fill="rgb(32,119,190)" fill-opacity="0.31" d="M71 170 L121 170 L96 128 Z" />
</svg>
